# Render Blueprint for the FastAPI backend (New > Blueprint > pick this repo).
# The frontend goes on Vercel; see docs/DEPLOY.md.
services:
  - type: web
    name: two-futures-api
    runtime: python
    plan: free
    rootDir: backend
    # The engine reads ../data/*.json, so build filters must include it too.
    buildFilter:
      paths:
        - backend/**
        - data/**
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ping
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false # Render asks for the value when you create the Blueprint
      - key: PLAID_SECRET
        sync: false
      # The browser never calls this server directly (Next proxies /api), so CORS only
      # matters for local tools. Set it to your Vercel URL anyway.
      - key: ALLOWED_ORIGINS
        sync: false
